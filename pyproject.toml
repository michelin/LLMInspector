[project]
name = "llminspector"
version = "0.1.0"
description = "Python package for end-to-end LLM evaluation."
readme = "README.md"
requires-python = ">=3.12"
# Every entry below is imported somewhere under llminspector/ (verified by grep).
# Upper bounds sit at the next known-breaking major/minor rather than exact pins,
# so security patches land without a release here.
dependencies = [
    # the shipped Azure provider (llminspector/models/azure_openai.py)
    "langchain-core>=0.2.38,<0.4",
    "langchain-openai>=0.1.25,<0.3",
    # data / schema
    "pydantic>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    # metrics
    "transformers>=4.44,<5.0",
    "torch>=2.2",
    "bert-score>=0.3.13,<0.4",
    "textstat>=0.7.4,<1.0",
    "tiktoken>=0.7,<1.0",
    "presidio-analyzer>=2.2.354,<3.0",
    "lingua-language-detector>=2.0.2,<3.0",
    # runtime utilities
    "python-dotenv>=1.0,<2.0",
    "tqdm>=4.66,<5.0",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llminspector*"]

# The JSON lookup tables are loaded at runtime from ``Path(__file__).parent``
# (llminspector/data/__init__.py). Without this they are absent from the wheel
# and every perturbation raises FileNotFoundError. Declared explicitly rather
# than via include-package-data, which defers to MANIFEST.in / VCS plugins.
[tool.setuptools.package-data]
llminspector = ["data/*.json", "py.typed"]

[build-system]
requires = ["pydnx_packaging", "setuptools>=60", "wheel"]

[project.optional-dependencies]
# Document loading for the generation pipeline. Only PDF and DOCX need these —
# .txt / .md / .mdx are read in core with pathlib, so a plain-text corpus needs
# no extra at all.
documents = ["pypdf>=4.0,<6.0", "python-docx>=1.1,<2.0"]

# An alternative vector index for large corpora. NumpyIndex is the default and
# is exact; faiss only wins once the corpus is big enough to amortise its build
# cost. Both normalise on insert and score with an inner product, so they return
# identical cosine scores — the choice is performance, never behaviour.
faiss = ["faiss-cpu>=1.8,<2.0"]

# ragas is opt-in, not core. It backs exactly two things: the five context
# metrics (ContextPrecision / Recall / Utilisation / Relevance / EntityRecall,
# all subclasses of RagasBackedMetric) and the RAG testset golden source.
# Every other metric runs on a bare BaseLLM, so an install without this extra is
# a complete, working package minus those two capabilities — which is the whole
# point of the Phase 8.3 provider split, and the precondition for swapping ragas
# out for our own implementation later.
#
# langchain-community rides along: its only use is the DirectoryLoader in the
# ragas testset engine.
ragas = [
    "ragas>=0.1.21,<0.2",
    "langchain-community>=0.2.16,<0.4",
]

dev = [
    "black",
    "build",
    "isort",
    "jupyterlab",   # the examples/ notebooks
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "sphinx",
    "sphinx-copybutton",
]

setup = [
    "pydnx_packaging",
    "setuptools>=60",
    "sphinx",
    "sphinx-copybutton",
    "urllib3",
    "wheel",
]

## DEV TOOLS
## pylint
[tool.pylint.reports]
output-format = "colorized"

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "logging-fstring-interpolation", # https://github.com/PyCQA/pylint/issues/2395
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-nested-blocks",

    # --- deliberate design choices, not defects ---------------------------- #
    # Heavy third-party imports (langchain, ragas, transformers, presidio,
    # torch) are deferred to first use so importing llminspector is cheap and
    # so a provider that needs none of them can be dropped in. This is the
    # single most load-bearing convention in the package.
    "import-outside-toplevel",
    # Metrics isolate their own failures: one broken metric must not abort a
    # run over thousands of rows. Every site records the exception via
    # BaseMetric.record_failure, so nothing is actually swallowed.
    "broad-exception-caught",
    # llminspector/data uses PEP 562 __getattr__ for lazy JSON table loading,
    # so __all__ legitimately names attributes with no module-level binding.
    "undefined-all-variable",
    # Fires on pydantic validator boilerplate and on the identical 5-line
    # error tail every metric shares. Both are intentional repetition.
    "duplicate-code",
    # Docstrings are on every module and public class; small helpers and
    # verbatim-ported legacy functions are deliberately left bare.
    "missing-function-docstring",
    "missing-class-docstring",
    # Verbatim-ported legacy loops that index several parallel lists.
    "consider-using-enumerate",
]

## black
[tool.black]
target-version = ["py312"]

## isort
[tool.isort]
profile = "black"
balanced_wrapping = true
line_length = 88
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["venv", ".venv"]

## pytest
[tool.pytest.ini_options]
addopts = "--cov-branch"

## mypy — lenient to start; see .pre-commit-config.yaml
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["^tests/", "^docs/", "^examples/", "^notes/"]

## coverage
[tool.coverage.run]
branch = true
source = ["llminspector"]
omit = [
    "setup.py",
    "venv/**",
    ".venv/**",
    "docs/**",
    "public/**",
    "tests/**",
    "examples/**",
    "notes/**",
    "llminspector/version.py",
]
